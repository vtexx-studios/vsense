name: Build Vsense CS2 DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies (ImGui, MinHook, CS2-Dumper)
      run: |
        git clone https://github.com/ocornut/imgui.git external_imgui
        git clone https://github.com/TsudaKageyu/minhook.git external_minhook
        git clone https://github.com/a2x/cs2-dumper.git external_dumper

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build and Run CS2-Dumper
      run: |
        cd external_dumper
        cmake -B build
        cmake --build build --config Release
        cd build\bin\Release
        # Dumper'ı çalıştırıp güncel offsetleri üretiyoruz
        .\cs2-dumper.exe --output output
        cd ../../../../

    - name: Copy Generated Offsets to SDK
      run: |
        # Üretilen offsets.hpp dosyasını projedeki sdk/ klasörünün üzerine yazıyoruz
        if (Test-Path "external_dumper/build/bin/Release/output/offsets.hpp") {
            Copy-Item "external_dumper/build/bin/Release/output/offsets.hpp" -Destination "sdk/offsets.hpp" -Force
        } elseif (Test-Path "external_dumper/output/offsets.hpp") {
            Copy-Item "external_dumper/output/output/offsets.hpp" -Destination "sdk/offsets.hpp" -Force
        }

    - name: Compile DLL
      run: |
        cl /LD /EHsc /std:c++17 dllmain.cpp `
          external_imgui/imgui.cpp `
          external_imgui/imgui_draw.cpp `
          external_imgui/imgui_tables.cpp `
          external_imgui/imgui_widgets.cpp `
          external_imgui/backends/imgui_impl_win32.cpp `
          external_imgui/backends/imgui_impl_dx11.cpp `
          external_minhook/src/buffer.c `
          external_minhook/src/hook.c `
          external_minhook/src/trampoline.c `
          external_minhook/src/HDE/hde32.c `
          external_minhook/src/HDE/hde64.c `
          /I"external_imgui" `
          /I"external_imgui/backends" `
          /I"external_minhook/include" `
          /I"sdk" `
          user32.lib d3d11.lib dxgi.lib /Fe:Vsense.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vsense_DLL
        path: Vsense.dll
