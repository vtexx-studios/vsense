name: Build Vsense CS2 DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies (ImGui, MinHook)
      run: |
        git clone https://github.com/ocornut/imgui.git external_imgui
        git clone https://github.com/TsudaKageyu/minhook.git external_minhook

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download and Harmonize Offsets
      run: |
        New-Item -ItemType Directory -Force -Path "sdk"
        # 1. Güncel offsets.hpp dosyasını resmi repodan indiriyoruz
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.hpp" -OutFile "sdk/offsets.hpp"
        
        # 2. Dosyanın sonuna, esp.hpp ve aimbot.hpp dosyalarının kullandığı Offsets köprüsünü (alias) ekliyoruz
        $bridgeCode = @"

        // --- Vsense Custom Offsets Bridge ---
        namespace Offsets {
            inline std::ptrdiff_t& dwEntityList = cs2_dumper::offsets::client_dll::dwEntityList;
            inline std::ptrdiff_t& dwLocalPlayerPawn = cs2_dumper::offsets::client_dll::dwLocalPlayerPawn;
            inline std::ptrdiff_t& dwViewMatrix = cs2_dumper::offsets::client_dll::dwViewMatrix;
            inline std::ptrdiff_t& dwViewAngles = cs2_dumper::offsets::client_dll::dwViewAngles;
            inline std::ptrdiff_t& m_iHealth = cs2_dumper::offsets::client_dll::m_iHealth;
            inline std::ptrdiff_t& m_hPlayerPawn = cs2_dumper::offsets::client_dll::m_hPlayerPawn;
            inline std::ptrdiff_t& m_vOldOrigin = cs2_dumper::offsets::client_dll::m_vOldOrigin;
            inline std::ptrdiff_t& m_iTeamNum = cs2_dumper::offsets::client_dll::m_iTeamNum;
        }
        "@
        
        Add-Content -Path "sdk/offsets.hpp" -Value $bridgeCode
        Write-Host "offsets.hpp başarıyla indirildi ve köprü yapısı entegre edildi."

    - name: Compile DLL
      run: |
        cl /LD /EHsc /std:c++17 dllmain.cpp `
          external_imgui/imgui.cpp `
          external_imgui/imgui_draw.cpp `
          external_imgui/imgui_tables.cpp `
          external_imgui/imgui_widgets.cpp `
          external_imgui/backends/imgui_impl_win32.cpp `
          external_imgui/backends/imgui_impl_dx11.cpp `
          external_minhook/src/buffer.c `
          external_minhook/src/hook.c `
          external_minhook/src/trampoline.c `
          external_minhook/src/HDE/hde32.c `
          external_minhook/src/HDE/hde64.c `
          /I"external_imgui" `
          /I"external_imgui/backends" `
          /I"external_minhook/include" `
          /I"sdk" `
          user32.lib d3d11.lib dxgi.lib /Fe:Vsense.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vsense_DLL
        path: Vsense.dll
